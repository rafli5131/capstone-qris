version: '3.8'

services:
  # Metrics server untuk Prometheus scraping
  metrics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qris_metrics
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Override config.json values via env vars
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: qris_user
      DATABASE_PASSWORD: qris_pass
      DATABASE_NAME: qris_db
      DATABASE_SSLMODE: disable
      REDIS_ADDR: redis:6379
      WEB_PORT: "3000"
      METRICS_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - qris_net
    command: ["./server", "metrics"]  # Custom command untuk metrics server